<!DOCTYPE html>
<html>
<head>
  <style>
    @font-face {
      font-family: handwriting;
      src: url('handwriting.ttf') format('truetype');
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: handwriting, cursive;
    }

    .canvas-container {
      position: relative;
      width: 768px;
      height: 768px;
    }

    canvas {
      display: block;
    }
	  
    .overlay-text {
	position: absolute;
	bottom: 10px;
	left: 50%;
	transform: translateX(-50%);
	color: white;
	font-weight: bold;
	font-size: 1.4rem;
	text-shadow: 0 0 5px black;
	pointer-events: none;
	width: 90%;
	text-align: center;
}
	

  </style>
</head>

<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec4 vPosition;
attribute vec4 vColor;
attribute vec2 vTexCoord;

varying vec4 fColor;
varying vec2 fTexCoord;
varying float fUseTexture;

uniform mat4 modelView;
uniform mat4 projection;
uniform float uUseTexture;

void main() 
{
    gl_Position = projection * modelView * vPosition;
    fColor = vColor;
    fTexCoord = vTexCoord;
    fUseTexture = uUseTexture;
    gl_PointSize = 3.0;
} 
</script>

<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;

varying vec4 fColor;
varying vec2 fTexCoord;
varying float fUseTexture;

uniform sampler2D uTexture;

void main()
{    
    if (fUseTexture > 0.5){
        gl_FragColor = texture2D(uTexture, fTexCoord);
    } else {
        gl_FragColor = fColor;
    }
}
</script>

<script type="text/javascript" src="webgl-utils.js"></script>
<script type="text/javascript" src="initShaders.js"></script>
<script type="text/javascript" src="MV.js"></script>
<script type="text/javascript" src="solarsystem.js"></script>

<body>

<div class="canvas-container">
  <canvas id="gl-canvas" width="768" height="768">
    Oops ... your browser doesn't support the HTML5 canvas element
  </canvas>
  <p class="overlay-text">Controls: WASD for movement, EQ for elevation, and scroll wheel for fov. Press ESC to dismiss.</p>
</div>

<img id="earth" src="https://cdn.jsdelivr.net/gh/mikiahk/webgl-solar-system@main/earth_texture.jpg" crossorigin="anonymous" width="0" height="0">
<img id="mars" src="https://cdn.jsdelivr.net/gh/mikiahk/webgl-solar-system@main/mars_texture.jpg" crossorigin="anonymous" width="0" height="0">
<img id="jupiter" src="https://cdn.jsdelivr.net/gh/mikiahk/webgl-solar-system@main/jupiter_texture.jpg" crossorigin="anonymous" width="0" height="0">

</body>
</html>
